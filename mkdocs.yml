site_name: Biflux
site_description: Unified data engineering framework eliminating Train-Serve Skew
site_author: Franek Jemiolo
site_url: https://franekjemiolo.github.io/biflux/

repo_name: FranekJemiolo/biflux
repo_url: https://github.com/FranekJemiolo/biflux

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Getting Started: getting_started.md
  - Bond Pricing Model: tutorials.md
  - Benchmarks: benchmarks.md
