[package]
name = "biflux_core"
version = "0.1.0"
edition = "2021"
authors = ["Franek Jemiolo"]
description = "High-performance Rust/Arrow batch and stream execution engine for Biflux"

[lib]
name = "biflux_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
arrow = { version = "53.0", features = ["ipc", "json", "prettyprint"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }

[dev-dependencies]
tempfile = "3.10"
