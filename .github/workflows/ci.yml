name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-check:
    name: Rust Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "biflux-core"

      - name: Check Formatting
        run: cargo fmt --manifest-path biflux-core/Cargo.toml --all -- --check

      - name: Clippy Linter
        run: cargo clippy --manifest-path biflux-core/Cargo.toml --all-targets -- -D warnings

      - name: Run Cargo Tests
        run: cargo test --manifest-path biflux-core/Cargo.toml --all

  python-check:
    name: Python Lint, Type Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build & Install biflux in editable mode
        run: |
          uv venv
          uv pip install maturin ruff mypy pytest pytest-cov
          maturin develop --manifest-path biflux-core/Cargo.toml --uv
          uv pip install -e ".[dev]"

      - name: Ruff Format Check
        run: uv run ruff format --check biflux tests integration_tests examples benchmarks

      - name: Ruff Linter
        run: uv run ruff check biflux tests integration_tests examples benchmarks

      - name: Mypy Type Check
        run: uv run mypy biflux tests integration_tests examples benchmarks

      - name: Run PyTest with Coverage
        run: uv run pytest tests/ integration_tests/ --cov=biflux --cov-report=xml --cov-report=term

  build-wheels:
    name: Build Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Wheels with maturin-action
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path biflux-core/Cargo.toml
          sccache: 'true'
          manylinux: auto

      - name: Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: biflux-wheels-${{ matrix.os }}
          path: dist/*.whl
