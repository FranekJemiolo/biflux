site_name: Biflux
site_description: Unified data engineering framework eliminating Train-Serve Skew
site_author: Franek Jemiolo
site_url: https://franekjemiolo.github.io/biflux/

repo_name: FranekJemiolo/biflux
repo_url: https://github.com/FranekJemiolo/biflux

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - tables

nav:
  - Overview: index.md
  - Vision & Strategy: vision.md
  - Architecture: architecture.md
  - Kafka & S3 Integration: kafka_s3_integration.md
  - Getting Started: getting_started.md
  - Tutorials & Models: tutorials.md
  - Custom Python UDFs: udf.md
  - Benchmarks: benchmarks.md
  - Comparative Analysis: comparative_analysis.md
