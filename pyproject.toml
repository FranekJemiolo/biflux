[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "biflux"
version = "0.1.0"
description = "Unified data engineering framework eliminating Train-Serve Skew via compiled Polars/Arrow plans on Iceberg and Kafka"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Franek Jemiolo" }
]
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.0.0",
    "pyiceberg>=0.7.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "testcontainers[kafka]>=4.0.0",
    "mkdocs-material>=9.5.0",
]

[tool.maturin]
manifest-path = "biflux-core/Cargo.toml"
module-name = "biflux.biflux_core"
python-source = "."

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
